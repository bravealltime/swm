<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="40%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#02010a" />
    </radialGradient>
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Nebula -->
  <rect width="200" height="200" rx="20" fill="url(#bgDark)" />
  <!-- Stardust Stars -->
  <circle cx="35" cy="45" r="1.5" fill="#e9d5ff" opacity="0.8" />
  <circle cx="165" cy="40" r="2" fill="#e9d5ff" opacity="0.9" />
  <circle cx="140" cy="160" r="1.5" fill="#c084fc" opacity="0.7" />
  <circle cx="50" cy="155" r="1.5" fill="#e9d5ff" opacity="0.6" />
  <circle cx="175" cy="120" r="1" fill="#fff" opacity="0.8" />
  <circle cx="25" cy="110" r="1" fill="#fff" opacity="0.7" />

  <!-- Gravitational Void Ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />
  <circle cx="100" cy="100" r="78" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.3" />

  <!-- Cosmic Dark Worm Head & Body -->
  <g filter="url(#glowDark)">
    <!-- Back Horns / Spikes -->
    <path d="M70 65 Q40 35 15 55 Q40 75 65 75 Z" fill="#581c87" />
    <path d="M130 65 Q160 35 185 55 Q160 75 135 75 Z" fill="#581c87" />
    <!-- Crest Horns -->
    <path d="M85 55 Q70 18 50 30 Q70 48 80 60 Z" fill="#c084fc" />
    <path d="M115 55 Q130 18 150 30 Q130 48 120 60 Z" fill="#c084fc" />
    <!-- Center Crown Singularity Spike -->
    <path d="M96 45 Q100 10 104 45 Q100 35 96 45 Z" fill="#f3e8ff" />

    <!-- Main Serpentine Head Shell -->
    <path d="M60 90 C55 60 145 60 140 90 C138 125 125 155 100 165 C75 155 62 125 60 90 Z" fill="url(#voidGrad)" stroke="#e9d5ff" stroke-width="2" />

    <!-- Carapace Segment Plates -->
    <path d="M70 85 Q100 75 130 85 Q100 95 70 85 Z" fill="#2e1065" opacity="0.6" stroke="#c084fc" stroke-width="1" />
    <path d="M74 105 Q100 96 126 105 Q100 115 74 105 Z" fill="#2e1065" opacity="0.6" stroke="#c084fc" stroke-width="1" />
    <path d="M82 125 Q100 118 118 125 Q100 133 82 125 Z" fill="#2e1065" opacity="0.6" stroke="#c084fc" stroke-width="1" />

    <!-- Glowing Cosmic Eyes -->
    <polygon points="76,92 90,96 79,102" fill="#fff" />
    <polygon points="124,92 110,96 121,102" fill="#fff" />
    <circle cx="83" cy="96" r="5" fill="#e879f9" opacity="0.9" />
    <circle cx="117" cy="96" r="5" fill="#e879f9" opacity="0.9" />

    <!-- Cosmic Dark Core Void (Forehead) -->
    <polygon points="100,60 108,72 100,84 92,72" fill="#fff" stroke="#c084fc" stroke-width="2" />
    <circle cx="100" cy="72" r="3" fill="#6b21a8" />
  </g>

  <!-- Element Badge (Dark Emblem) -->
  <g transform="translate(145, 145)">
    <circle cx="20" cy="20" r="18" fill="#581c87" stroke="#c084fc" stroke-width="2" />
    <path d="M24 10 C18 12 14 17 14 23 C14 29 18 34 24 35 C20 34 17 31 17 26 C17 21 21 16 24 10 Z" fill="#e9d5ff" />
  </g>
</svg>
