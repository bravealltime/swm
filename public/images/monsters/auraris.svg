<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgWind" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#020817" />
    </radialGradient>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glowWind" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Nebula -->
  <rect width="200" height="200" rx="20" fill="url(#bgWind)" />
  <!-- Stardust Stars -->
  <circle cx="35" cy="45" r="1.5" fill="#a7f3d0" opacity="0.8" />
  <circle cx="165" cy="40" r="2" fill="#a7f3d0" opacity="0.9" />
  <circle cx="140" cy="160" r="1.5" fill="#34d399" opacity="0.7" />
  <circle cx="50" cy="155" r="1.5" fill="#a7f3d0" opacity="0.6" />
  <circle cx="175" cy="120" r="1" fill="#fff" opacity="0.8" />
  <circle cx="25" cy="110" r="1" fill="#fff" opacity="0.7" />

  <!-- Aurora Tempest Ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />
  <circle cx="100" cy="100" r="78" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.3" />

  <!-- Cosmic Wind Worm Head & Body -->
  <g filter="url(#glowWind)">
    <!-- Back Horns / Gale Frills -->
    <path d="M70 65 Q40 35 15 55 Q40 75 65 75 Z" fill="#047857" />
    <path d="M130 65 Q160 35 185 55 Q160 75 135 75 Z" fill="#047857" />
    <!-- Crest Horns -->
    <path d="M85 55 Q70 18 50 30 Q70 48 80 60 Z" fill="#34d399" />
    <path d="M115 55 Q130 18 150 30 Q130 48 120 60 Z" fill="#34d399" />
    <!-- Center Crown Horn -->
    <path d="M96 45 Q100 10 104 45 Q100 35 96 45 Z" fill="#ecfdf5" />

    <!-- Main Serpentine Head Shell -->
    <path d="M60 90 C55 60 145 60 140 90 C138 125 125 155 100 165 C75 155 62 125 60 90 Z" fill="url(#auroraGrad)" stroke="#a7f3d0" stroke-width="2" />

    <!-- Carapace Segment Plates -->
    <path d="M70 85 Q100 75 130 85 Q100 95 70 85 Z" fill="#022c22" opacity="0.6" stroke="#34d399" stroke-width="1" />
    <path d="M74 105 Q100 96 126 105 Q100 115 74 105 Z" fill="#022c22" opacity="0.6" stroke="#34d399" stroke-width="1" />
    <path d="M82 125 Q100 118 118 125 Q100 133 82 125 Z" fill="#022c22" opacity="0.6" stroke="#34d399" stroke-width="1" />

    <!-- Glowing Cosmic Eyes -->
    <polygon points="76,92 90,96 79,102" fill="#fff" />
    <polygon points="124,92 110,96 121,102" fill="#fff" />
    <circle cx="83" cy="96" r="5" fill="#6ee7b7" opacity="0.9" />
    <circle cx="117" cy="96" r="5" fill="#6ee7b7" opacity="0.9" />

    <!-- Cosmic Wind Core Gem (Forehead) -->
    <polygon points="100,60 108,72 100,84 92,72" fill="#fff" stroke="#34d399" stroke-width="2" />
    <circle cx="100" cy="72" r="3" fill="#10b981" />
  </g>

  <!-- Element Badge (Wind Emblem) -->
  <g transform="translate(145, 145)">
    <circle cx="20" cy="20" r="18" fill="#047857" stroke="#34d399" stroke-width="2" />
    <path d="M12 21 C12 17 15 14 19 14 C23 14 26 17 26 21 C26 23 24.5 25 22 25 L14 25" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" />
    <path d="M11 26 L23 26" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
