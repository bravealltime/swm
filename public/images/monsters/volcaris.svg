<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="45%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#0b0202" />
    </radialGradient>
    <linearGradient id="flareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glowFire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Nebula -->
  <rect width="200" height="200" rx="20" fill="url(#bgFire)" />
  <!-- Stardust Stars -->
  <circle cx="35" cy="45" r="1.5" fill="#fef08a" opacity="0.8" />
  <circle cx="165" cy="40" r="2" fill="#fef08a" opacity="0.9" />
  <circle cx="140" cy="160" r="1.5" fill="#f87171" opacity="0.7" />
  <circle cx="50" cy="155" r="1.5" fill="#fef08a" opacity="0.6" />
  <circle cx="175" cy="120" r="1" fill="#fff" opacity="0.8" />
  <circle cx="25" cy="110" r="1" fill="#fff" opacity="0.7" />

  <!-- Solar Corona Ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />
  <circle cx="100" cy="100" r="78" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3" />

  <!-- Cosmic Fire Worm Head & Body -->
  <g filter="url(#glowFire)">
    <!-- Back Horns / Frills -->
    <path d="M70 65 Q45 35 25 50 Q45 70 65 75 Z" fill="#b91c1c" />
    <path d="M130 65 Q155 35 175 50 Q155 70 135 75 Z" fill="#b91c1c" />
    <!-- Crest Horns -->
    <path d="M85 55 Q75 15 60 25 Q75 45 80 60 Z" fill="#f59e0b" />
    <path d="M115 55 Q125 15 140 25 Q125 45 120 60 Z" fill="#f59e0b" />
    <!-- Center Astral Crown Horn -->
    <path d="M96 45 Q100 10 104 45 Q100 35 96 45 Z" fill="#fef08a" />

    <!-- Main Serpentine Head Shell -->
    <path d="M60 90 C55 60 145 60 140 90 C138 125 125 155 100 165 C75 155 62 125 60 90 Z" fill="url(#flareGrad)" stroke="#fef08a" stroke-width="2" />

    <!-- Carapace Segment Plates -->
    <path d="M70 85 Q100 75 130 85 Q100 95 70 85 Z" fill="#7f1d1d" opacity="0.6" stroke="#f59e0b" stroke-width="1" />
    <path d="M74 105 Q100 96 126 105 Q100 115 74 105 Z" fill="#7f1d1d" opacity="0.6" stroke="#f59e0b" stroke-width="1" />
    <path d="M82 125 Q100 118 118 125 Q100 133 82 125 Z" fill="#7f1d1d" opacity="0.6" stroke="#f59e0b" stroke-width="1" />

    <!-- Glowing Cosmic Eyes -->
    <polygon points="76,92 90,96 79,102" fill="#fff" />
    <polygon points="124,92 110,96 121,102" fill="#fff" />
    <circle cx="83" cy="96" r="5" fill="#fef08a" opacity="0.9" />
    <circle cx="117" cy="96" r="5" fill="#fef08a" opacity="0.9" />

    <!-- Cosmic Core Gem (Forehead) -->
    <polygon points="100,60 108,72 100,84 92,72" fill="#fff" stroke="#f59e0b" stroke-width="2" />
    <circle cx="100" cy="72" r="3" fill="#ef4444" />
  </g>

  <!-- Element Badge (Fire Emblem) -->
  <g transform="translate(145, 145)">
    <circle cx="20" cy="20" r="18" fill="#991b1b" stroke="#f87171" stroke-width="2" />
    <path d="M20 7 C23 14 29 17 29 23 C29 28 25 32 20 32 C15 32 11 28 11 23 C11 17 17 14 20 7 Z" fill="#fef08a" />
    <path d="M20 16 C22 20 25 22 25 25 C25 28 23 30 20 30 C17 30 15 28 15 25 C15 22 18 20 20 16 Z" fill="#ef4444" />
  </g>
</svg>
