<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="35%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#020817" />
    </radialGradient>
    <linearGradient id="solarLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Nebula -->
  <rect width="200" height="200" rx="20" fill="url(#bgLight)" />
  <!-- Stardust Stars -->
  <circle cx="35" cy="45" r="2" fill="#fff" opacity="0.9" />
  <circle cx="165" cy="40" r="2" fill="#fef08a" opacity="0.9" />
  <circle cx="140" cy="160" r="1.5" fill="#fde047" opacity="0.8" />
  <circle cx="50" cy="155" r="1.5" fill="#fff" opacity="0.7" />
  <circle cx="175" cy="120" r="1.5" fill="#fff" opacity="0.8" />
  <circle cx="25" cy="110" r="1" fill="#fff" opacity="0.7" />

  <!-- Supernova Rays -->
  <line x1="100" y1="20" x2="100" y2="180" stroke="#fef08a" stroke-width="1" opacity="0.25" />
  <line x1="20" y1="100" x2="180" y2="100" stroke="#fef08a" stroke-width="1" opacity="0.25" />
  <circle cx="100" cy="100" r="70" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />
  <circle cx="100" cy="100" r="78" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.4" />

  <!-- Cosmic Light Worm Head & Body -->
  <g filter="url(#glowLight)">
    <!-- Back Horns / Wings -->
    <path d="M70 65 Q40 30 15 45 Q40 70 65 75 Z" fill="#b45309" />
    <path d="M130 65 Q160 30 185 45 Q160 70 135 75 Z" fill="#b45309" />
    <!-- Crest Horns -->
    <path d="M85 55 Q70 15 50 25 Q70 45 80 60 Z" fill="#fef08a" />
    <path d="M115 55 Q130 15 150 25 Q130 45 120 60 Z" fill="#fef08a" />
    <!-- Center Crown Supernova Spike -->
    <path d="M96 45 Q100 5 104 45 Q100 35 96 45 Z" fill="#ffffff" />

    <!-- Main Serpentine Head Shell -->
    <path d="M60 90 C55 60 145 60 140 90 C138 125 125 155 100 165 C75 155 62 125 60 90 Z" fill="url(#solarLightGrad)" stroke="#ffffff" stroke-width="2.5" />

    <!-- Carapace Segment Plates -->
    <path d="M70 85 Q100 75 130 85 Q100 95 70 85 Z" fill="#451a03" opacity="0.6" stroke="#fef08a" stroke-width="1" />
    <path d="M74 105 Q100 96 126 105 Q100 115 74 105 Z" fill="#451a03" opacity="0.6" stroke="#fef08a" stroke-width="1" />
    <path d="M82 125 Q100 118 118 125 Q100 133 82 125 Z" fill="#451a03" opacity="0.6" stroke="#fef08a" stroke-width="1" />

    <!-- Glowing Cosmic Eyes -->
    <polygon points="76,92 90,96 79,102" fill="#fff" />
    <polygon points="124,92 110,96 121,102" fill="#fff" />
    <circle cx="83" cy="96" r="5" fill="#ffffff" opacity="1" />
    <circle cx="117" cy="96" r="5" fill="#ffffff" opacity="1" />

    <!-- Cosmic Light Core Star (Forehead) -->
    <polygon points="100,55 109,72 100,88 91,72" fill="#fff" stroke="#fef08a" stroke-width="2" />
    <circle cx="100" cy="72" r="3.5" fill="#f59e0b" />
  </g>

  <!-- Element Badge (Light Emblem) -->
  <g transform="translate(145, 145)">
    <circle cx="20" cy="20" r="18" fill="#d97706" stroke="#fef08a" stroke-width="2" />
    <polygon points="20,7 23,16 32,20 23,24 20,33 17,24 8,20 17,16" fill="#fff" />
  </g>
</svg>
