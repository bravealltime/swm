<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgWater" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="45%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020817" />
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glowWater" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Nebula -->
  <rect width="200" height="200" rx="20" fill="url(#bgWater)" />
  <!-- Stardust Stars -->
  <circle cx="35" cy="45" r="1.5" fill="#bae6fd" opacity="0.8" />
  <circle cx="165" cy="40" r="2" fill="#bae6fd" opacity="0.9" />
  <circle cx="140" cy="160" r="1.5" fill="#38bdf8" opacity="0.7" />
  <circle cx="50" cy="155" r="1.5" fill="#bae6fd" opacity="0.6" />
  <circle cx="175" cy="120" r="1" fill="#fff" opacity="0.8" />
  <circle cx="25" cy="110" r="1" fill="#fff" opacity="0.7" />

  <!-- Abyssal Astral Wave Ring -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />
  <circle cx="100" cy="100" r="78" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Cosmic Water Worm Head & Body -->
  <g filter="url(#glowWater)">
    <!-- Back Horns / Fin Frills -->
    <path d="M70 65 Q40 40 20 60 Q45 75 65 75 Z" fill="#0369a1" />
    <path d="M130 65 Q160 40 180 60 Q155 75 135 75 Z" fill="#0369a1" />
    <!-- Crest Horns -->
    <path d="M85 55 Q70 20 55 35 Q75 50 80 60 Z" fill="#38bdf8" />
    <path d="M115 55 Q130 20 145 35 Q125 50 120 60 Z" fill="#38bdf8" />
    <!-- Center Crown Crystal -->
    <path d="M96 45 Q100 10 104 45 Q100 35 96 45 Z" fill="#e0f2fe" />

    <!-- Main Serpentine Head Shell -->
    <path d="M60 90 C55 60 145 60 140 90 C138 125 125 155 100 165 C75 155 62 125 60 90 Z" fill="url(#waveGrad)" stroke="#bae6fd" stroke-width="2" />

    <!-- Carapace Segment Plates -->
    <path d="M70 85 Q100 75 130 85 Q100 95 70 85 Z" fill="#082f49" opacity="0.6" stroke="#38bdf8" stroke-width="1" />
    <path d="M74 105 Q100 96 126 105 Q100 115 74 105 Z" fill="#082f49" opacity="0.6" stroke="#38bdf8" stroke-width="1" />
    <path d="M82 125 Q100 118 118 125 Q100 133 82 125 Z" fill="#082f49" opacity="0.6" stroke="#38bdf8" stroke-width="1" />

    <!-- Glowing Cosmic Eyes -->
    <polygon points="76,92 90,96 79,102" fill="#fff" />
    <polygon points="124,92 110,96 121,102" fill="#fff" />
    <circle cx="83" cy="96" r="5" fill="#7dd3fc" opacity="0.9" />
    <circle cx="117" cy="96" r="5" fill="#7dd3fc" opacity="0.9" />

    <!-- Cosmic Water Core Gem (Forehead) -->
    <polygon points="100,60 108,72 100,84 92,72" fill="#fff" stroke="#38bdf8" stroke-width="2" />
    <circle cx="100" cy="72" r="3" fill="#0284c7" />
  </g>

  <!-- Element Badge (Water Emblem) -->
  <g transform="translate(145, 145)">
    <circle cx="20" cy="20" r="18" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <path d="M20 8 C20 8 12 18 12 24 C12 29 15.5 32 20 32 C24.5 32 28 29 28 24 C28 18 20 8 20 8 Z" fill="#bae6fd" />
    <path d="M19 17 C19 17 15 22 15 25 C15 28 17 30 19 30 C21 30 23 28 23 25 C23 22 19 17 19 17 Z" fill="#0284c7" />
  </g>
</svg>
